url: https://seanthimons.github.io/concert/

template:
  bootstrap: 5
  bootswatch: flatly

destination: docs/site

navbar:
  structure:
    left: [intro, articles, reference, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
        - text: Cleaning pipeline
          href: articles/cleaning-pipeline.html
        - text: Measurement harmonization
          href: articles/harmonization.html
        - text: Headless curation
          href: articles/headless-curation.html

reference:
  - title: Run the app
    contents:
      - run_app
  - title: Headless curation
    desc: Curate a file without the Shiny app, or drive it from an agent loop.
    contents:
      - curate_headless
      - curate_iterate
      - curate_decisions_template
      - starts_with("stage_")
      - run_curation_pipeline
      - generate_concert_script
      - write_curation_output
      - parse_concert_export
  - title: Read files and detect frontmatter
    contents:
      - safely_read_file
      - validate_file
      - validate_excel_size
      - starts_with("detect_data_start")
      - detect_pattern_based
      - detect_by_type_consistency
      - extract_clean_data
      - handle_merged_cells
      - calculate_smart_preview_rows
      - format_file_size
  - title: Tag columns
    contents:
      - suggest_column_tags
      - classify_tags
      - validate_tag_pairing
      - has_required_chemical_tags
      - detect_tag_changes
      - find_dtxsid_cols
  - title: Clean names and identifiers
    contents:
      - run_cleaning_pipeline
      - apply_value_corrections
      - build_audit_trail
      - clean_text_field
      - clean_unicode
      - perform_unicode_qc
      - detect_non_ascii_chars
      - starts_with("strip_")
      - starts_with("normalize_cas")
      - rescue_cas_from_text
      - detect_multi_cas
      - detect_truncated_compound_names
      - detect_bare_formulas
      - expand_isotope_shortcodes
      - protect_chiral_designations
      - restore_chiral_designations
      - split_synonyms
      - extract_cas
      - extract_formulas
      - extract_mixture
      - as_cas
      - is_cas
      - flag_reference_matches
      - dedup_step
      - get_dedup_preview
      - remap_audit_to_parent
      - inject_row_lineage
      - starts_with("precheck_")
  - title: Multi-analyte rows
    contents:
      - flag_multi_analyte
      - suggest_multi_analyte_parts
      - resolve_multi_analyte_row
      - apply_multi_analyte_resolutions
      - is_multi_analyte_review_row
  - title: Reference lists
    contents:
      - starts_with("load_")
      - merge_reference_lists
      - save_user_reference_lists
      - update_user_reference_list
      - validate_reference_list_patterns
      - reference_list_help_text
      - refresh_isotope_cache
      - refresh_wqx_cache
      - clear_starts_with_cache
  - title: Resolve identities
    desc: CompTox and WQX matching, consensus, and review.
    contents:
      - match_wqx
      - classify_consensus
      - classify_auto_resolve
      - compute_similarity_scores
      - score_one_candidate
      - enrich_candidates
      - enrich_synonyms
      - merge_retry_results
      - apply_priority_chain
      - compute_qc_tier
      - init_resolution_state
      - get_resolution_options
      - resolve_row
      - resolve_review_row
      - accept_all_suggestions
      - build_review_overrides
      - apply_review_overrides
      - apply_review_resolutions
      - validate_manual_dtxsids
      - starts_with("set_row_flag")
      - normalize_row_flag
      - valid_row_flags
      - hydrate_session_state
  - title: Harmonize measurements
    contents:
      - parse_numeric_results
      - parse_dates
      - harmonize_units
      - harmonize_media
      - normalize_uncertainty_to_two_sigma
      - classify_detection_events
      - classify_harmonized_detection
      - map_to_toxval_schema
      - build_export_sheets
  - title: Dataset context and sites
    contents:
      - detect_site_columns
      - extract_site_candidates
      - build_site_manifest
      - build_chorus_site_manifest
      - build_site_alias_map
      - normalize_site_manifest
  - title: Shiny modules
    contents:
      - starts_with("mod_")
      - notify_user
      - log_condition
  - title: internal
    contents:
      - CHIRAL_PLACEHOLDER_PREFIX
      - deduplicate_tagged_columns
      - detect_narrative
      - extract_qualifier
      - map_results_to_rows
      - normalize_numeric_string
      - run_tiered_search
      - search_exact
      - search_starts_with
      - split_ranges
      - validate_and_lookup_cas
