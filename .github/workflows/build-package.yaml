name: Build Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v5 pinned by commit SHA for supply-chain stability.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up R
        # r-lib/actions/setup-r v2 pinned by commit SHA.
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up pandoc
        # r-lib/actions/setup-pandoc v2 pinned by commit SHA.
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          package="$(Rscript -e "cat(read.dcf('DESCRIPTION', fields = 'Package')[1, 'Package'])")"
          version="$(Rscript -e "cat(read.dcf('DESCRIPTION', fields = 'Version')[1, 'Version'])")"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build source package
        id: build
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          R CMD build .
          tarball="${PACKAGE}_${VERSION}.tar.gz"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Upload source package
        # actions/upload-artifact v4 pinned by commit SHA for supply-chain stability.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.metadata.outputs.package }}-${{ steps.metadata.outputs.version }}-source
          path: ${{ steps.build.outputs.tarball }}
          if-no-files-found: error
          retention-days: 14
