name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # The shared workflow lists the PR's commits through the API; it fails at startup if the
    # calling job grants less than this.
    permissions:
      contents: read
      pull-requests: read
    uses: seanthimons/baseline/.github/workflows/gitleaks.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
