name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    # The shared workflow lists the PR's commits through the API; it fails at startup if the
    # calling job grants less than this.
    permissions:
      contents: read
      pull-requests: read
    uses: seanthimons/baseline/.github/workflows/gitleaks.yaml@ad7b0409c5ae8d28f293826fef0819bd74c7b9e0 # v2.2.0
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
