name: Release on PR Merge

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      release_note:
        description: Release note for a manual version bump
        required: false
        default: Manual release.

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        # actions/checkout v5 pinned by commit SHA for supply-chain stability.
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        # r-lib/actions/setup-r v2 pinned by commit SHA.
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up pandoc
        # r-lib/actions/setup-pandoc v2 pinned by commit SHA.
        uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Set up TinyTeX
        # r-lib/actions/setup-tinytex v2 pinned by commit SHA.
        uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Bump package version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MANUAL_RELEASE_NOTE: ${{ inputs.release_note }}
        shell: bash
        run: |
          git pull --ff-only origin main

          Rscript - <<'RSCRIPT'
          clean_line <- function(x) {
            gsub("\\s+", " ", trimws(x))
          }

          bump_patch_version <- function(version) {
            parts <- strsplit(version, ".", fixed = TRUE)[[1]]
            if (length(parts) != 3 || any(!grepl("^[0-9]+$", parts))) {
              stop("DESCRIPTION Version must have three numeric components: ", version)
            }

            parts[3] <- as.character(as.integer(parts[3]) + 1L)
            paste(parts, collapse = ".")
          }

          desc <- readLines("DESCRIPTION", warn = FALSE)
          version_line <- grep("^Version:[[:space:]]*", desc)
          if (length(version_line) != 1) {
            stop("DESCRIPTION must contain exactly one Version field.")
          }

          current_version <- sub("^Version:[[:space:]]*", "", desc[version_line])
          new_version <- bump_patch_version(current_version)
          tag <- paste0("v", new_version)

          tag_exists <- system2(
            "git",
            c("rev-parse", "-q", "--verify", paste0("refs/tags/", tag)),
            stdout = TRUE,
            stderr = TRUE
          )
          if (length(tag_exists) > 0) {
            stop("Release tag ", tag, " already exists.")
          }

          desc[version_line] <- paste("Version:", new_version)
          writeLines(desc, "DESCRIPTION")

          pr_number <- clean_line(Sys.getenv("PR_NUMBER"))
          pr_title <- clean_line(Sys.getenv("PR_TITLE"))
          manual_note <- clean_line(Sys.getenv("MANUAL_RELEASE_NOTE"))

          if (nzchar(pr_number)) {
            note <- paste0("* Release from PR #", pr_number, ": ", pr_title)
          } else if (nzchar(manual_note)) {
            note <- paste0("* ", manual_note)
          } else {
            note <- "* Manual release."
          }

          news <- readLines("NEWS.md", warn = FALSE)
          new_section <- c(
            paste0("# concert ", new_version),
            "",
            note,
            ""
          )
          writeLines(c(new_section, news), "NEWS.md")

          notes_path <- file.path(Sys.getenv("RUNNER_TEMP"), "release-notes.md")
          writeLines(note, notes_path)

          output <- Sys.getenv("GITHUB_OUTPUT")
          write(paste0("previous_version=", current_version), output, append = TRUE)
          write(paste0("version=", new_version), output, append = TRUE)
          write(paste0("tag=", tag), output, append = TRUE)
          write(paste0("notes_path=", notes_path), output, append = TRUE)
          RSCRIPT

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESCRIPTION NEWS.md
          commit_message="chore: bump package version to $VERSION"
          if [ -n "$PR_NUMBER" ]; then
            commit_message="$commit_message (#$PR_NUMBER)"
          fi
          git commit -m "$commit_message"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install package dependencies
        # r-lib/actions/setup-r-dependencies v2 pinned by commit SHA.
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Validate release
        run: Rscript -e "rcmdcheck::rcmdcheck(args = '--as-cran', error_on = 'warning')"

      - name: Build source package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          R CMD build .
          mkdir -p "$RUNNER_TEMP/pkg-build"
          mv "concert_${VERSION}.tar.gz" "$RUNNER_TEMP/pkg-build/"
          echo "tarball=$RUNNER_TEMP/pkg-build/concert_${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_PATH: ${{ steps.version.outputs.notes_path }}
          TARBALL: ${{ steps.build.outputs.tarball }}
        shell: bash
        run: |
          git tag -a "$TAG" -m "Release $TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" "$TARBALL#Source package" \
            --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_PATH" \
            --verify-tag
