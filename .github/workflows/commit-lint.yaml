name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    uses: seanthimons/baseline/.github/workflows/commit-lint.yaml@ad7b0409c5ae8d28f293826fef0819bd74c7b9e0 # v2.2.0
