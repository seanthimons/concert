name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit Lint
    uses: seanthimons/baseline/.github/workflows/commit-lint.yaml@067b932909c9ca4cdce189717c99a62a812d3db9 # v2.2.1
