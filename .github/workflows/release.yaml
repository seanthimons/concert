name: Release

# Tokens: github.token (GITHUB_PAT) installs dependencies. RELEASE_PAT is used
# only by the push and GitHub release steps; it is a fine-grained PAT with
# Contents read/write on this repo, owned by an account allowed to push to main.

on:
  # Merges to main cut a patch release unless they only touch docs, site, CI,
  # tests or tooling.
  # The workflow's own bump/NEWS commits carry [skip ci], so they do not retrigger it.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'vignettes/articles/**'
      - '.github/**'
      - '.planning/**'
      - '.beans/**'
      - '.beans.yml'
      - '**.md'
      - 'tests/**'
      - 'scripts/**'
      - 'air.toml'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version component to bump'
        required: true
        default: patch
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ github.token }}
      # Push runs have no inputs; they default to a patch bump.
      VERSION_TYPE: ${{ inputs.version_type || 'patch' }}
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Set up Quarto
        # autonewsmd renders NEWS.md via Quarto; required on PATH for write().
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::desc
            any::devtools
            any::autonewsmd
            any::rcmdcheck

      - name: Configure git identity
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and document
        if: env.VERSION_TYPE != 'none'
        shell: Rscript {0}
        run: |
          desc::desc_bump_version(Sys.getenv("VERSION_TYPE"))
          devtools::document()

      - name: Read metadata and guard against existing tag
        id: metadata
        shell: bash
        run: |
          package="$(Rscript -e "cat(read.dcf('DESCRIPTION', fields = 'Package')[1, 'Package'])")"
          version="$(Rscript -e "cat(read.dcf('DESCRIPTION', fields = 'Version')[1, 'Version'])")"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists on origin."
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check package
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")

      - name: Commit version bump and tag locally
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git add DESCRIPTION man/ NAMESPACE
          git diff --cached --quiet || git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git tag "v${VERSION}"

      - name: Generate NEWS.md
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
        shell: Rscript {0}
        run: |
          an <- autonewsmd::autonewsmd$new(
            repo_name = Sys.getenv("PACKAGE"),
            repo_path = getwd()
          )
          an$generate()
          an$write(force = TRUE)
          # Use headings understood by pkgdown's NEWS parser.
          news <- readLines("NEWS.md")
          news <- news[news != "# concert NEWS"]
          news[news == "## Development"] <- "## concert (development version)"
          news <- sub("^## v([0-9])", "## concert \\1", news)
          writeLines(news, "NEWS.md")

      - name: Commit NEWS.md and finalize tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git add NEWS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update NEWS.md for v${VERSION} [skip ci]"
            git tag -f "v${VERSION}"
          fi

      - name: Build source package
        env:
          PACKAGE: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          R CMD build .
          test -f "${PACKAGE}_${VERSION}.tar.gz"

      # One atomic push: main and the tag update together or not at all.
      - name: Push commits and tag
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin main "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.metadata.outputs.package }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "${PACKAGE} v${VERSION}" \
            --notes "See [NEWS.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/NEWS.md) for details." \
            "${PACKAGE}_${VERSION}.tar.gz"
