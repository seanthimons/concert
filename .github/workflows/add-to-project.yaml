# Adds every new issue in this repository to the cross-repo Tooling project.
# Secret ADD_TO_PROJECT_PAT: classic personal access token with the project scope
# (plus repo, because one token also serves a private repository). The default
# GITHUB_TOKEN cannot write to a user-level project.
name: Add to project

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  add:
    name: Add to project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/users/seanthimons/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
