name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.planning/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    if: github.actor != 'github-actions[bot]'
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: release }
          - { os: windows-latest, r: release }
          - { os: macos-latest,   r: release }

    env:
      GITHUB_PAT: ${{ github.token }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package
        uses: r-lib/actions/check-r-package@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          upload-snapshots: true
