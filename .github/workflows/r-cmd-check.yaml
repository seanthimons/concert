name: R-CMD-check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.planning/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'NEWS.md'
      - '**/*.md'
      - '.planning/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    # Cross-platform compatibility checks are opt-in, not routine PR checks.
    if: github.event_name == 'workflow_dispatch'
    name: R CMD check
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@733a6e4554870ab2fa8dd7495fa67bea029bb38c # v1.3.0

  # ponytail: stays local; baseline r-renv-tests runs test_dir() without loading
  # the package, so concert's tests cannot find package functions there.
  locked-review:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ github.token }}
      # Disposable runner: avoid the slow final staged-library move on Windows.
      RENV_CONFIG_INSTALL_STAGED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up R from renv.lock
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv
      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Verify locked review environment
        shell: Rscript {0}
        run: |
          stopifnot(renv::status()$synchronized)
          testthat::test_local(filter = 'review|modules-render|wqx|pubchem-fallback')
