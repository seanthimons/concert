version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
    # Baseline pins are bumped by track-release-pr.yaml; third-party actions
    # keep their Dependabot PRs.
    ignore:
      - dependency-name: "seanthimons/baseline*"
